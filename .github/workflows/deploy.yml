name: Deploy to Hostinger

on:
  push:
    branches:
      - master
  # Ручний запуск. Потрібен тоді, коли змінився не код, а секрет: конфіг
  # приймача заявок складається саме тут, і без цього рядка його довелося б
  # оновлювати порожнім комітом.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Уся історія, а не один коміт: крок IndexNow нижче питає у git, які
          # саме сторінки змінилися в цьому пуші. На мілкому клоні `git diff`
          # по діапазону просто не має що порівнювати.
          fetch-depth: 0

      - name: Install sshpass and rsync
        run: sudo apt-get install -y sshpass rsync

      # Синтаксис PHP — до rsync, а не після. Приймач заявок тут один файл, і
      # помилка в ньому кладе не сторінку, а саме приймання: форма отримує
      # порожню п'ятисотку, відвідувач — червоний блок, і дізнаємось ми про це
      # від людини, яка не змогла записатись. Локально PHP на машині немає,
      # тож ця перевірка — єдине місце, де помилку видно до прода.
      - name: Перевірити синтаксис PHP
        run: |
          for f in $(find api -name '*.php'); do
            php -l "$f"
          done

      - name: Deploy via rsync over SSH
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sshpass -e rsync -avz --delete \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='CLAUDE.md' \
            --exclude='*.md' \
            --exclude='*.jsonl' \
            --exclude='tools/' \
            --exclude='seo/' \
            --exclude='__pycache__/' \
            --exclude='node_modules/' \
            --exclude='src/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='tailwind.config.js' \
            -e "ssh -p ${{ secrets.SFTP_PORT }} -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:/home/u260300169/domains/fluent-fox.site/public_html/

      # Сказати Bing, що сторінки змінилися, — протокол IndexNow. Саме після
      # rsync, а не до: попросити переобійти адресу, за якою ще лежить старий
      # файл, означає закріпити в індексі те, що ми щойно виправили.
      #
      # Крок не валить викатку: сайт уже на проді, а непроханий обхід — річ
      # приємна, але не обов'язкова. Подаються тільки сторінки з цього пуша і
      # тільки ті, що є в карті сайту (див. tools/indexnow/submit.py).
      - name: Повідомити IndexNow про змінені сторінки
        continue-on-error: true
        run: |
          before="${{ github.event.before }}"
          # Перший пуш у гілку та force-push дають нулі або коміт, якого вже
          # немає. Тоді подаємо всю карту: 84 адреси раз на такий випадок
          # дешевше, ніж мовчки не подати нічого.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            python3 tools/indexnow/submit.py --all
          else
            python3 tools/indexnow/submit.py --changed "$before..${{ github.sha }}"
          fi

      # Конфіг приймача заявок кладеться НЕ в public_html, а на рівень вище:
      # rsync вище крок чистить public_html через --delete, і файл із токеном
      # там не пережив би жодної викатки. Заодно він недосяжний по HTTP.
      #
      # Крок мовчки нічого не робить, якщо секрету немає: перезаписати робочий
      # конфіг порожнім токеном — гірше, ніж не чіпати його зовсім.
      - name: Покласти конфіг приймача заявок
        env:
          SSHPASS:   ${{ secrets.SFTP_PASSWORD }}
          CRM_TOKEN: ${{ secrets.CRM_ADMIN_TOKEN }}
          CANARY:    ${{ secrets.CANARY_TOKEN }}
          # Адреса для дубля заявки листом. Секрет, а не рядок тут: репозиторій
          # публічний, і адреса з нього поїхала б у спам-бази. Немає секрету —
          # рядок у конфізі порожній, листи не шлються, заявки не страждають.
          NOTIFY:    ${{ secrets.LEAD_NOTIFY_EMAIL }}
          SHEET_URL: https://script.google.com/macros/s/AKfycbxAA1T6SIdTeldgSFmT-3HUEfRBUIq7-v79uGBe3UbVnTQBlespZMrsgNQMqmZKCzEGqA/exec
        run: |
          if [ -z "$CRM_TOKEN" ]; then
            echo "::warning title=CRM_ADMIN_TOKEN не заданий::lead-config.php не чіпали — заявки підуть тільки в Google-таблицю"
            exit 0
          fi
          # base64 замість екранування лапок: на виході тільки A-Za-z0-9+/=,
          # тож рядок не розірве PHP-літерал, хай яким буде токен.
          token=$(printf '%s' "$CRM_TOKEN" | base64 -w0)
          canary=$(printf '%s' "$CANARY" | base64 -w0)
          notify=$(printf '%s' "$NOTIFY" | base64 -w0)
          if [ -z "$NOTIFY" ]; then
            echo "::warning title=LEAD_NOTIFY_EMAIL не заданий::дубль заявки листом вимкнено"
          fi
          {
            echo "<?php"
            echo "// Складає деплой із секрету CRM_ADMIN_TOKEN. Руками не правити:"
            echo "// наступна викатка перезапише. Зразок — api/lead-config.sample.php."
            echo "return ["
            echo "    'crm_token' => base64_decode('${token}'),"
            echo "    'crm_url'   => 'https://mycomputer.education/api/leads/admin',"
            echo "    'sheet_url' => '${SHEET_URL}',"
            echo "    'canary_token' => base64_decode('${canary}'),"
            echo "    'notify_email' => base64_decode('${notify}'),"
            echo "];"
          } | sshpass -e ssh -p ${{ secrets.SFTP_PORT }} -o StrictHostKeyChecking=no \
                ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }} \
                "cat > /home/u260300169/domains/fluent-fox.site/lead-config.php && chmod 600 /home/u260300169/domains/fluent-fox.site/lead-config.php"
          echo "Конфіг оновлено."

      # Те саме для ключів оплати: секрет мерчанта WayForPay і токен MonoPay
      # дозволяють створювати рахунки від імені школи, тож у public_html їм
      # місця немає так само, як токену CRM.
      #
      # Немає секретів — крок мовчить, api/pay.php відповідає 503 і нічого не
      # створює, а кнопка на /oplata показує людині, що оплата тимчасово
      # недоступна. Це навмисно: платіжний ендпоінт із порожнім ключем гірший
      # за вимкнений.
      - name: Покласти конфіг оплати
        env:
          SSHPASS:      ${{ secrets.SFTP_PASSWORD }}
          WFP_MERCHANT: ${{ secrets.WFP_MERCHANT }}
          WFP_SECRET:   ${{ secrets.WFP_SECRET }}
          MONO_TOKEN:   ${{ secrets.MONO_TOKEN }}
        run: |
          if [ -z "$WFP_SECRET" ] && [ -z "$MONO_TOKEN" ]; then
            echo "::warning title=Ключів оплати немає::pay-config.php не чіпали — кнопки на /oplata відповідатимуть 503"
            exit 0
          fi
          # base64 з тієї ж причини, що й для токена CRM: на виході лише
          # A-Za-z0-9+/=, тож ключ не розірве PHP-літерал.
          merchant=$(printf '%s' "$WFP_MERCHANT" | base64 -w0)
          secret=$(printf '%s' "$WFP_SECRET" | base64 -w0)
          mono=$(printf '%s' "$MONO_TOKEN" | base64 -w0)
          {
            echo "<?php"
            echo "// Складає деплой із секретів WFP_MERCHANT, WFP_SECRET, MONO_TOKEN."
            echo "// Руками не правити: наступна викатка перезапише."
            echo "// Зразок — api/pay-config.sample.php."
            echo "return ["
            echo "    'wfp_merchant' => base64_decode('${merchant}'),"
            echo "    'wfp_secret'   => base64_decode('${secret}'),"
            echo "    'mono_token'   => base64_decode('${mono}'),"
            echo "];"
          } | sshpass -e ssh -p ${{ secrets.SFTP_PORT }} -o StrictHostKeyChecking=no                 ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}                 "cat > /home/u260300169/domains/fluent-fox.site/pay-config.php && chmod 600 /home/u260300169/domains/fluent-fox.site/pay-config.php"
          echo "Конфіг оплати оновлено."
