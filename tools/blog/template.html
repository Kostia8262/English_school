<!DOCTYPE html>
<html lang="%(lang)s">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>%(title)s</title>
<meta name="description" content="%(desc)s"/>
<meta name="robots" content="index, follow"/>
<meta name="author" content="%(author)s"/>
<link rel="canonical" href="%(url_self)s"/>
<link rel="alternate" hreflang="uk" href="%(url_uk)s"/>
<link rel="alternate" hreflang="ru" href="%(url_ru)s"/>
<link rel="alternate" hreflang="x-default" href="%(url_uk)s"/>
<meta property="og:type" content="article"/>
<meta property="og:site_name" content="FluentFox"/>
<meta property="og:title" content="%(og_title)s"/>
<meta property="og:description" content="%(og_desc)s"/>
<meta property="og:url" content="%(url_self)s"/>
<meta property="og:image" content="%(base)s/og-image.jpg"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:image:alt" content="%(og_image_alt)s"/>
<meta property="og:locale" content="%(og_locale)s"/>
<meta property="og:locale:alternate" content="%(og_locale_alt)s"/>
<meta property="article:published_time" content="%(published)s"/>
<meta property="article:modified_time" content="%(modified)s"/>
<meta property="article:section" content="%(section)s"/>
<meta property="article:author" content="%(author)s"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="%(og_title)s"/>
<meta name="twitter:description" content="%(og_desc)s"/>
<meta name="twitter:image" content="%(base)s/og-image.jpg"/>
<!-- ═══ Favicon ═══ -->
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="theme-color" content="#FF6B35"/>

<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K60LSESFTV"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-K60LSESFTV');</script>

<script type="application/ld+json">%(graph)s</script>

<!-- Шрифт свій, правила @font-face — усередині style.css. Підмножина
     cyrillic несе весь текст сторінки, тому її беремо наперед, не
     чекаючи, доки браузер дочитає таблицю стилів. -->
<link rel="preload" as="font" type="font/woff2" href="/fonts/nunito-cyrillic.woff2" crossorigin/>
<link rel="preload" as="style" href="/css/style.css?v=%(assetv)s"/>
<link rel="stylesheet" href="/css/style.css?v=%(assetv)s" fetchpriority="high"/>
<style>
.gradient-text{background:linear-gradient(135deg,#FF6B35,#E54E1A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.prose h2{font-size:1.25rem;font-weight:900;color:#111827;margin-top:2rem;margin-bottom:.75rem;line-height:1.25;padding-left:.875rem;border-left:4px solid #FF6B35}
.prose h3{font-size:1.125rem;font-weight:800;color:#374151;margin-top:1.5rem;margin-bottom:.5rem}
.prose h3.qa-q{color:#BF3C0F}
.prose p{color:#374151;line-height:1.625;margin-bottom:1rem;font-size:1rem}
.prose ul,.prose ol{margin:.75rem 0 1rem 0;display:flex;flex-direction:column;gap:.5rem;padding-left:0}
.prose ul{list-style:none}
.prose ol{list-style:none;counter-reset:step}
.prose li{position:relative;padding-left:1.5rem;color:#374151;line-height:1.625;font-size:1rem}
.prose ul li::before{content:'';position:absolute;left:0;top:.55em;width:.5rem;height:.5rem;border-radius:50%%;background:#FF6B35}
.prose ol li{counter-increment:step;padding-left:2rem}
.prose ol li::before{content:counter(step);position:absolute;left:0;top:.1em;width:1.35rem;height:1.35rem;border-radius:50%%;background:#FFE8D6;color:#BF3C0F;font-size:.8rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.prose strong{font-weight:800;color:#111827}
.callout{background:#FFF5EF;border-left:4px solid #FF6B35;border-radius:0 1rem 1rem 0;padding:1rem 1.25rem;margin:1.5rem 0}
.callout p{margin:0;color:#374151}
/* Врізка від першої особи: humanize-guide просить нестандартний блок і живий
   голос із іменем, а не текст від безликої «редакції». */
.expert{margin:1.75rem 0;padding:1.25rem 1.5rem;background:#F4F0FF;border-radius:1rem;border:1px solid #EAE2FF}
.expert blockquote{margin:0;color:#374151;line-height:1.75;font-size:1rem;font-style:italic}
.expert figcaption{margin-top:.75rem;font-size:.8125rem;font-weight:700;color:#6D28D9}
/* Контекстне посилання на посадкову. Без кольорового ранта збоку — щоб не
   повторювати .callout, який уже є поруч, і не множити той самий прийом. */
.course-link{background:#FFF5EF;border:1px solid #FFE8D6;border-radius:1rem;padding:1.1rem 1.3rem;margin:1.75rem 0}
.course-link p{margin:0;color:#374151}
.course-link .cl-label{font-size:.6875rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#BF3C0F;margin-bottom:.35rem}
.course-link .cl-title{font-size:1rem;font-weight:800;color:#111827;line-height:1.45;margin-bottom:.7rem}
.course-link a{display:inline-flex;align-items:center;gap:.4rem;font-size:.9375rem;font-weight:900;color:#E54E1A;text-decoration:none}
.course-link a:hover{color:#BF3C0F}
.table-wrap{overflow-x:auto;margin:1.5rem 0;border:1px solid #FFE8D6;border-radius:1rem;background:#fff}
.table-wrap table{width:100%%;min-width:34rem;border-collapse:collapse}
.table-wrap th{text-align:left;font-size:.8125rem;font-weight:900;color:#111827;padding:.75rem 1rem;background:#FFF5EF;white-space:nowrap}
.table-wrap td{padding:.75rem 1rem;font-size:.9375rem;color:#374151;border-top:1px solid #FFE8D6;line-height:1.6}
/* Слайдер «Читайте також»: ті самі два правила, що в лістингу блогу й на
   головній — картка підіймається під курсором, смуга прокрутки не видно. */
.card-lift{transition:transform .3s ease,box-shadow .3s ease}
.card-lift:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(255,107,53,0.18)}
.scrollbar-hide::-webkit-scrollbar{display:none}
.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
</style>
</head>
<body class="font-sans antialiased bg-cream">

<header class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-sm shadow-sm">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <a href="%(home)s" class="flex items-center gap-2">
        <span class="text-3xl">&#129418;</span>
        <span class="flex flex-col leading-none">
          <span class="text-2xl font-black text-gray-900 leading-none">Fluent<span class="gradient-text">Fox</span></span>
          <span class="text-2xs font-bold uppercase tracking-widest text-gray-500 mt-1">English School</span>
        </span>
      </a>
      <div class="hidden md:flex items-center gap-6">
%(nav)s
      </div>
      <div class="flex items-center gap-3">
        <div class="flex items-center bg-gray-100 rounded-full p-0.5 text-sm font-bold">
          <!-- Звичайні посилання, без перехоплення кліку. Мова тепер — це
               окремий файл на сервері, тож перехід має відбутися насправді:
               саме так її бачить і краулер, і читач без JS. -->
          <a href="%(url_uk)s" hreflang="uk" class="px-2.5 py-1 rounded-full transition-all duration-200 %(sw_uk)s">UA</a>
          <a href="%(url_ru)s" hreflang="ru" class="px-2.5 py-1 rounded-full transition-all duration-200 %(sw_ru)s">RU</a>
        </div>
        <a href="%(form)s" class="hidden md:inline-flex items-center bg-fox-500 hover:bg-fox-600 text-white text-sm font-black px-4 py-2 rounded-full transition-all duration-200 shadow-fox-sm hover:shadow-fox hover:-translate-y-0.5">%(l_trial)s</a>
      </div>
    </div>
  </nav>
</header>

<main class="pt-24 pb-20">
  <div class="max-w-3xl mx-auto px-4 sm:px-6">

    <nav class="flex items-center gap-2 text-sm text-gray-400 mb-8" aria-label="%(l_crumbs)s">
      <a href="%(home)s" class="hover:text-fox-500 transition-colors">%(l_home)s</a>
      <span>/</span><a href="%(blog)s" class="hover:text-fox-500 transition-colors">%(l_blog)s</a>
      <span>/</span><span class="text-gray-600">%(crumb)s</span>
    </nav>

%(body)s

  </div>
</main>

<footer class="bg-gray-950 text-gray-400 py-10">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">
      <a href="%(home)s" class="flex items-center gap-2">
        <span class="text-3xl">&#129418;</span>
        <span class="flex flex-col leading-none">
          <span class="text-xl font-black text-white leading-none">Fluent<span class="text-fox-500">Fox</span></span>
          <span class="text-2xs font-bold uppercase tracking-widest text-gray-400 mt-1">English School</span>
        </span>
      </a>
      <div class="flex flex-wrap gap-x-6 gap-y-2 text-sm">
%(footer)s
        <a href="https://child.mycomputer.education/" target="_blank" rel="noopener" class="hover:text-fox-400 transition-colors">%(l_doshkolyaryk)s</a>
      </div>
      <p class="text-xs text-gray-600">&copy; 2026 FluentFox</p>
    </div>
  </div>
</footer>

</body>
</html>
